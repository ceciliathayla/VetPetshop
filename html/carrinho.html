<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/carrinho.css">
</head>
<body>
    


<div id="carrinho-lateral" class="carrinho-container">
    <div class="carrinho-header">
        <h2 class="titulo-carrinho">Seu Carrinho</h2>
    </div>

    <div class="itens-carrinho">
        <div class="item-no-carrinho">
            <img src="../img/calça carno 1 nova.jfif" alt="Produto">
            <div class="info-produto">
                <h4 class="nome-item">Cargo Wide Leg</h4>
                <p class="preco-item">R$ 239,90</p>
                <div class="controles">
                    <input type="number" value="1" class="input-qtd">
                    <button class="btn-lixeira">🗑️</button>
                </div>
            </div>
        </div>
    </div>

    <div class="carrinho-footer">
        <div class="total-box">
            <span>Total:</span>
            <span>R$ 239,90</span>
        </div>
        <button class="btn-finalizar">FINALIZAR COMPRA</button>
        <button class="btn-voltar">Continuar Comprando</button>
    </div>
</div>


</body>
</html>
